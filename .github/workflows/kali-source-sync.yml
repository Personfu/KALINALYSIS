name: Kali Source Sync

on:
  schedule:
    # Every Sunday at 04:00 UTC (after the catalog update)
    - cron: "0 4 * * 0"
  workflow_dispatch:
    inputs:
      only_id:
        description: "Sync only a specific source_id (leave blank for all)"
        required: false
        default: ""
      dry_run:
        description: "Dry run (no commits)"
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: write

jobs:
  sync-sources:
    name: Sync external source mirrors
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r scripts/kali/requirements.txt

      - name: Run source sync
        run: |
          DRY_RUN_FLAG=""
          ONLY_FLAG=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_RUN_FLAG="--dry-run"
          fi
          if [ -n "${{ github.event.inputs.only_id }}" ]; then
            ONLY_FLAG="--only ${{ github.event.inputs.only_id }}"
          fi
          python scripts/kali/sync_external_sources.py \
            --mirrors data/kali/source-mirrors.json \
            --state   data/kali/source-sync-state.json \
            --dest    external_sources/ \
            --verbose \
            $DRY_RUN_FLAG \
            $ONLY_FLAG

      - name: Commit and push state file
        if: github.event.inputs.dry_run != 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/kali/source-sync-state.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(sync): update source-sync-state.json [skip ci]"
            git push
          fi

      - name: Upload sync state artifact
        uses: actions/upload-artifact@v4
        with:
          name: source-sync-state
          path: data/kali/source-sync-state.json
          retention-days: 30
