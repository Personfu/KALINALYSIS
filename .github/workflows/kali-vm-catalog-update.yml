name: Kali VM Catalog Update

on:
  schedule:
    # Every Sunday at 02:00 UTC
    - cron: "0 2 * * 0"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no commits)"
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: write

jobs:
  update-catalog:
    name: Fetch releases and regenerate catalog
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r scripts/kali/requirements.txt

      - name: Run catalog updater
        run: |
          DRY_RUN_FLAG=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_RUN_FLAG="--dry-run"
          fi
          python scripts/kali/update_kali_catalog.py \
            --output   data/kali/vm-releases.json \
            --sources  data/kali/sources.json \
            --catalog  docs/kali/catalog.md \
            --vbox-dir samples/vbox \
            --verbose \
            $DRY_RUN_FLAG

      - name: Commit and push changes
        if: github.event.inputs.dry_run != 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/kali/vm-releases.json docs/kali/catalog.md
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(catalog): auto-update VM releases and catalog [skip ci]"
            git push
          fi
